services:
  postgres:
    image: 'postgres:18.6'
    container_name: 'postgres-meetup'
    restart: 'no'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    env_file: './db/.env'
    volumes:
      - 'postgres_data:/var/lib/postgresql'
    healthcheck:
      test: 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  postgres_data:
